[package]
name = "containerhub-remote"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
containerhub-management = { path = "../management", optional = true }
containerhub-core = { path = "../core", optional = true }
anyhow.workspace = true
async-trait = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }
thiserror.workspace = true
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
snow = { version = "0.10", default-features = false, features = ["default-resolver", "use-chacha20poly1305", "use-sha2", "use-curve25519", "use-getrandom"] }
zeroize = "1"
rusqlite = { version = "0.40", features = ["bundled"], optional = true }
futures-util = { version = "0.3", features = ["sink"], optional = true }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"], optional = true }
url = { version = "2", optional = true }
wasm-bindgen = { version = "=0.2.129", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }

[dev-dependencies]
containerhub-core = { path = "../core", features = ["test-support"] }
tempfile = "3"
async-channel.workspace = true

[[example]]
name = "development_fixture"
required-features = ["development"]

[features]
default = ["native"]
native = ["dep:containerhub-management", "dep:containerhub-core", "dep:async-trait", "dep:tokio", "dep:rusqlite", "dep:futures-util", "dep:tokio-tungstenite", "dep:url"]
development = ["native"]
browser = ["dep:wasm-bindgen"]
