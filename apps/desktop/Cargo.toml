[package]
name = "containerhub"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
containerhub-runtime = { path = "../../crates/runtime" }
containerhub-management = { path = "../../crates/management" }
containerhub-core = { path = "../../crates/core" }
containerhub-apple = { path = "../../crates/providers/apple" }
containerhub-remote = { path = "../../crates/remote" }
gpui-kit = "=0.8.0"
anyhow.workspace = true
async-channel.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util = "0.3"
chrono = { version = "0.4", default-features = false, features = ["std"] }


# Bundle icons in development too; never read the Cargo registry at runtime.
rust-embed = { version = "8", features = ["debug-embed"] }

[features]
dev-build = []
demo-preview = ["containerhub-runtime/demo"]
ui-validation = ["demo-preview", "gpui-kit/test-support"]
remote-development = ["containerhub-runtime/development"]

[dev-dependencies]
async-trait.workspace = true
containerhub-core = { path = "../../crates/core", features = ["test-support"] }
