[workspace]
resolver = "3"
members = ["crates/core", "crates/host", "crates/management", "crates/providers/apple", "crates/providers/docker", "crates/remote", "apps/agent", "crates/runtime", "apps/bridge"]
default-members = ["crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "Apache-2.0"
authors = ["BackRunner <dev@backrunner.top>"]
repository = "https://github.com/backrunner/containerhub"

[workspace.dependencies]
anyhow = "1"
async-channel = "2"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "process", "time", "io-util", "macros", "sync", "net", "signal", "io-std"] }

[profile.dev]
debug = 1
incremental = false

[profile.release]
lto = "thin"
codegen-units = 1
