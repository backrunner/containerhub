<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ContainerHub · 等距应用图标</title><link rel="icon" type="image/png" href="containerhub-app-icon-v4.png">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f9;color:#1c2331;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
main{max-width:1120px;margin:0 auto;padding:36px 32px 32px}header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:28px}h1{margin:0;font-size:24px;font-weight:650;letter-spacing:-.6px}header span{font-size:12px;color:#626f82}
.board{display:grid;grid-template-columns:1fr 1fr;border:1px solid #e1e6ee;border-radius:16px;overflow:hidden;background:#fff}.panel{padding:24px 28px}.panel{background:linear-gradient(145deg,#fafcff,#e9eef6)}.panel+.panel{border-left:1px solid #29303c;background:radial-gradient(ellipse at 50% 40%,#27374b,#111822 85%)}.panel+.panel .label,.panel+.panel .caption{color:#a0b0c5}.panel+.panel .label b{color:#e4e9f2}.label{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:#626f82}.label b{color:#34435c;font-weight:550}.art{height:320px;display:flex;align-items:center;justify-content:center}.mark{width:300px;height:300px;object-fit:contain}.app-icon{width:256px;height:256px;border-radius:22%;display:block;box-shadow:0 14px 30px -12px #334b6b66,0 0 0 1px #61779826}.caption{font-size:12px;color:#626f82;margin:0}
.applications{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}.sample{gap:16px;display:flex;align-items:center;justify-content:space-between;min-height:116px;background:#fff;border:1px solid #e1e6ee;border-radius:12px;padding:20px 24px}.identity{display:flex;align-items:center;gap:12px}.identity img{width:40px;height:40px;border-radius:9px}.identity strong{display:block;font-size:16px;font-weight:600;letter-spacing:-.4px}.identity small{display:block;font-size:11px;color:#626f82;margin-top:1px}.sizes{display:flex;align-items:flex-end;gap:14px}.sizes figure{margin:0;text-align:center;font-size:10px;color:#7c889c}.sizes img{display:block;margin:0 auto 6px}.sizes img{border-radius:22%}.dark{background:#151920;border-color:#29303c;color:#e4e9f2}.dark small{color:#a0aabd}footer{display:flex;justify-content:space-between;gap:16px;margin-top:24px;font-size:12px;color:#626f82}a{color:#245cce;text-decoration:none}
@media(max-width:800px){.applications{grid-template-columns:1fr}}
@media(max-width:600px){main{padding:24px 20px}.board,.applications{grid-template-columns:1fr}.panel+.panel{border-left:0;border-top:1px solid #e1e6ee}.art{height:290px}.mark{width:260px;height:260px}.app-icon{width:240px;height:240px}header span{display:none}.sizes{gap:9px}footer{flex-direction:column}}
</style></head><body><main>
<header><h1>ContainerHub</h1><span>应用图标 / 04</span></header>
<section class="board" aria-label="等距应用图标的浅深背景预览">
<div class="panel"><div class="label"><b>等距容器堆叠</b><span>浅色背景</span></div><div class="art"><img class="app-icon" src="containerhub-app-icon-v4.png" alt="三枚钴蓝玻璃容器以等距视角堆叠于珍珠白图标底面"></div><p class="caption">柔和倒角、磨砂顶面与清晰的层间阴影。</p></div>
<div class="panel"><div class="label"><b>同一图标 · 深色环境</b><span>深色背景</span></div><div class="art"><img class="app-icon" src="containerhub-app-icon-v4.png" alt="深色背景中的 ContainerHub 等距玻璃应用图标"></div><p class="caption">收敛的边缘高光，保留蓝色体积与白色留白。</p></div>
</section>
<section class="applications" aria-label="品牌组合与小尺寸预览">
<div class="sample"><div class="identity"><img src="containerhub-app-icon-v4.png" alt=""><div><strong>ContainerHub</strong><small>本机工作空间</small></div></div><div class="sizes" aria-label="18、32 和 64 像素图标"><figure><img src="containerhub-app-icon-v4.png" width="18" height="18" alt="18 px 图标"><figcaption>18</figcaption></figure><figure><img src="containerhub-app-icon-v4.png" width="32" height="32" alt="32 px 图标"><figcaption>32</figcaption></figure><figure><img src="containerhub-app-icon-v4.png" width="64" height="64" alt="64 px 图标"><figcaption>64</figcaption></figure></div></div>
<div class="sample dark"><div class="identity"><img src="containerhub-app-icon-v4.png" alt=""><div><strong>ContainerHub</strong><small>本机工作空间</small></div></div><div class="sizes" aria-label="18、32 和 64 像素深色背景图标"><figure><img src="containerhub-app-icon-v4.png" width="18" height="18" alt="18 px 图标"><figcaption>18</figcaption></figure><figure><img src="containerhub-app-icon-v4.png" width="32" height="32" alt="32 px 图标"><figcaption>32</figcaption></figure><figure><img src="containerhub-app-icon-v4.png" width="64" height="64" alt="64 px 图标"><figcaption>64</figcaption></figure></div></div>
</section>
<footer><span>等距视角 · 钴蓝玻璃 · 珍珠白底</span><a href="../">查看应用中的使用 →</a></footer>
</main></body></html>
