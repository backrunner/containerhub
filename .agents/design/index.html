<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ContainerHub · 交互设计稿</title>
  <link rel="icon" type="image/png" href="brand/containerhub-app-icon-v4.png">
  <link rel="stylesheet" href="style.css?v=8.3">
  <link rel="stylesheet" href="tokens.css?v=8.3">
  <link rel="stylesheet" href="refinement.css?v=8.3">
  <link rel="stylesheet" href="environment.css?v=8.3">
  <link rel="stylesheet" href="stacks.css?v=8.3">
  <link rel="stylesheet" href="containers.css?v=8.3">
</head>
<body>
  <div class="review-bar">
    <div class="review-title"><span class="brand-symbol review-symbol" aria-hidden="true"></span><strong>ContainerHub</strong><span class="review-divider"></span><span>设计稿 v8.3 · 示例数据</span></div>
    <div class="review-controls">
      <label>场景 <select id="scenario" aria-label="设计场景"><option value="normal">日常管理</option><option value="partial">部分失败</option><option value="offline">运行时离线</option><option value="empty">没有容器</option></select></label>
      <button id="width-toggle" class="review-button" aria-pressed="false">窄窗口</button>
      <button id="theme-toggle" class="review-button" aria-label="切换深色主题"><span data-icon="Moon"></span><span id="theme-label">深色</span></button>
    </div>
  </div>
  <div id="app" class="app-window">
    <header class="titlebar">
      <div class="window-identity"><div class="traffic-lights" aria-hidden="true"><i></i><i></i><i></i></div><span class="app-wordmark">ContainerHub</span></div>
      <button class="environment-trigger" id="environment-button" aria-label="切换环境" aria-expanded="false"><span data-icon="Monitor"></span><strong>演示工作空间</strong><span class="crumb-separator">/</span><span class="crumb-runtime">Apple container</span><span data-icon="ChevronDown"></span></button>
      <div class="titlebar-end"><button id="command-button" class="command-trigger"><span data-icon="Search"></span><span>搜索容器</span><kbd>⌘ K</kbd></button><button class="icon-button bordered" id="settings-button" aria-label="设置与外观"><span data-icon="Settings"></span></button></div>
    </header>
    <div class="app-body">
      <aside class="sidebar">
        <div class="workspace-mark"><span class="brand-symbol" role="img" aria-label="ContainerHub Logo"></span><div><strong>ContainerHub</strong><small>演示工作空间</small></div></div>
        <div class="nav-caption">资源</div>
        <nav aria-label="主导航" id="navigation">
          <button data-page="containers" class="active" aria-current="page"><span data-icon="Container"></span><span>容器</span><span class="nav-count" id="container-count">8</span></button>
          <button data-page="stacks" hidden><span data-icon="Layers"></span><span>Stacks</span></button>
          <button data-page="images"><span data-icon="Layers"></span><span>镜像</span><span class="nav-count" id="image-count">7</span></button>
          <button data-page="volumes"><span data-icon="Database"></span><span>存储卷</span></button>
          <button data-page="networks"><span data-icon="Network"></span><span>网络</span></button>
          <div class="nav-caption">管理</div>
          <button data-page="runtime"><span data-icon="Server"></span><span>环境管理</span></button>
          <button data-page="tasks"><span data-icon="ListChecks"></span><span>任务中心</span><span class="nav-count" id="task-count">3</span></button>
        </nav>
        <div class="sidebar-spacer"></div>
      </aside>
      <main class="workspace" id="workspace">
        <div id="offline-banner" class="offline-banner" hidden><span data-icon="WifiOff"></span><div><strong>无法连接 Apple container</strong><span>显示最后一次同步的数据，资源操作暂不可用。</span></div><button class="button" id="reconnect-button">检查环境</button></div>
        <div class="page-heading"><div><div class="breadcrumb">工作空间 <span>/</span> <span id="breadcrumb-current">容器</span></div><div class="heading-line"><h1 id="page-title">容器</h1><span class="count-chip" id="page-count">8</span></div><p id="page-description">本机的所有容器，随时就绪。</p></div><div class="heading-actions"><button class="button" id="secondary-action"><span data-icon="Download"></span>拉取镜像</button><button class="button primary" id="primary-action"><span data-icon="Plus"></span>新建容器</button></div></div>
        <section id="page-content"></section>
      </main>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </div>
  <div class="review-caption"><span>原生桌面优先</span><span>Rust + GPUI</span><span>设计稿不会执行本机命令</span><a href="../DESIGN.md">设计规范 ↗</a></div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <script src="icons.js?v=8.3"></script>
  <script src="environment-data.js?v=8.3"></script>
  <script src="environment-charts.js?v=8.3"></script>
  <script src="environments.js?v=8.3"></script>
  <script src="environment-forms.js?v=8.3"></script>
  <script src="environment-menu.js?v=8.3"></script>
  <script src="runtime-service.js?v=8.3"></script>
  <script src="images.js?v=8.3"></script>
  <script src="pagination.js?v=8.3"></script>
  <script src="ports.js?v=8.3"></script>
  <script src="swarm.js?v=8.3"></script>
<script src="container-overview.js?v=8.3"></script>
<script src="stacks.js?v=8.3"></script>
<script src="stack-actions.js?v=8.3"></script>
<script src="environment-docker.js?v=8.3"></script>
<script src="environment-editor.js?v=8.3"></script>
  <script src="app.js?v=8.3"></script>
</body>
</html>
